<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1E2517">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- With viewport-fit=cover and this style the installed iPhone app draws under the status bar: styles.css keeps
     the header clear of it with env(safe-area-inset-top). -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Maple Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"><p class="boot">Loading your tracker…</p></div>
<noscript><p class="boot">This tracker needs JavaScript turned on.</p></noscript>
<script>
// If the app's own files fail to load or to fit together (a dropped request, or old and new files mixed right
// after an update), say so instead of showing "Loading" for ever. Only acts while the loading line is on screen.
(function () {
  var first = document.querySelector('#app .boot');
  var loading = first ? first.textContent : '';
  function failed(e) {
    var t = e && e.target;
    // Pictures, fonts and style sheets that fail are not the app failing to start.
    if (t && t !== window && t.nodeName !== 'SCRIPT') return;
    var boot = document.querySelector('#app .boot');
    if (!boot || boot.textContent !== loading) return;
    boot.textContent = "The tracker didn't load properly. Reload the page. If it keeps happening, check your connection.";
  }
  window.addEventListener('error', failed, true);
  window.addEventListener('unhandledrejection', failed);
})();
</script>
<script type="module" src="app/main.js"></script>
</body>
</html>
