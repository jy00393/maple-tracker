name: Update Nexon data and deploy

on:
  push:
    branches: [main]
  schedule:
    # Every 6 hours at minute 17 (UTC). GitHub may start scheduled runs a few minutes late.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test the parser
        run: node --test scripts/test/*.test.mjs

      - name: Pull Nexon news, events and characters
        run: node scripts/update-data.mjs

      - name: Save changed data back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/news.json site/data/events.json site/data/posts.json site/data/characters.json site/data/calendar.ics site/data/items.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update Nexon data"
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
