name: Update Nexon data and deploy

on:
  push:
    branches: [main]
  schedule:
    # Every 6 hours at minute 17 (UTC). GitHub may start scheduled runs a few minutes late.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Always the newest main, not the commit that started the run: a run that waited behind another one then
      # starts from that run's data commit.
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test the parser
        run: node --test scripts/test/*.test.mjs

      - name: Pull Nexon news, events and characters
        run: node scripts/update-data.mjs

      - name: Save changed data back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/news.json site/data/events.json site/data/posts.json site/data/characters.json site/data/calendar.ics site/data/items.json site/data/shops.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update Nexon data"
            # main can move while this run works (a push from the computer). Then the data commit is put on top of
            # the new main and pushed once more. Where the push and this run changed the same lines of a data file,
            # nothing is overwritten (shops.json holds fields typed by hand): this run's commit is not saved, and
            # the run started by that push works from the new main and saves the data. No merge strategy option
            # (-X ours/theirs) belongs here. The site is deployed from this run's files either way.
            if ! git push origin HEAD:main; then
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then
                echo "Saved after catching up with main."
              else
                git rebase --abort 2>/dev/null || true
                echo "::warning::main moved during this run and its data could not be put on top; nothing was overwritten. The next run will save the data."
              fi
            fi
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
